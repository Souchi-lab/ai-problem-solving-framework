name: Test macOS Bash

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify-macos-bash:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Bash version
        shell: bash
        run: |
          echo "=== Shell info ==="
          echo "SHELL: $SHELL"
          bash --version
          echo ""
          echo "=== OS info ==="
          uname -a
          sw_vers

      - name: Make scripts executable
        shell: bash
        run: chmod +x scripts/net-mem-stat.sh scripts/net-mem-monitor.sh

      - name: "[Phase 1] One-shot — net-mem-stat.sh"
        shell: bash
        run: |
          echo "--- single sample ---"
          bash scripts/net-mem-stat.sh

      - name: "[Phase 2] Rotation verify — 10s interval / 1min rotation / 3min"
        shell: bash
        run: |
          echo "--- 10s interval, 1min rotation, 3min total ---"
          # net-mem-monitor.sh を 3分 + 少し余裕でバックグラウンド起動
          bash scripts/net-mem-monitor.sh "$HOME/logs" 10 1 1 &
          MONITOR_PID=$!
          sleep 185
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          echo ""
          echo "=== Generated log files ==="
          ls -lh "$HOME/logs/"
          echo ""
          for f in "$HOME/logs"/network_*.log; do
            echo "--- $(basename "$f") ---"
            cat "$f"
          done

      - name: "[Phase 3] Production smoke test — 60s interval / 60min rotation / 3min"
        shell: bash
        run: |
          echo "--- 60s interval, 60min rotation, 3min smoke test ---"
          bash scripts/net-mem-monitor.sh "$HOME/logs-prod" 60 60 24 &
          MONITOR_PID=$!
          sleep 185
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          echo ""
          echo "=== Generated log files ==="
          ls -lh "$HOME/logs-prod/"
          echo ""
          for f in "$HOME/logs-prod"/network_*.log; do
            echo "--- $(basename "$f") ---"
            cat "$f"
          done
