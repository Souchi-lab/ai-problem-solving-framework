[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apsf"
version = "0.1.0"
description = "AI Problem Solving Framework — CLI/Human-first, multi-model, role-separated"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # API libraries are optional — install only when using future-api executor
    # pip install "apsf[api]"
]

[project.optional-dependencies]
api = [
    "openai>=1.0",
    "anthropic>=0.20",
    "google-generativeai>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
apsf = "apsf.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apsf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
